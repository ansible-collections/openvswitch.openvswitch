---
# No easy way to know OS type without python or without ansible facts.
# Run below raw commands and one would succeed with apt/dnf on debian/centos
- name: Run prepare_ovs_tests
  when: prepare_ovs_tests_task | default(False) | bool
  block:
    # network-integration test are ran with gather_facts: no
    # We need to explicitly call setup so ansible_distribution is set
    - name: Gather facts
      ansible.builtin.setup:
      become: true

    - name: Enable repositories on RedHat/CentOS/Rocky
      when: ansible_facts['os_family'] == 'RedHat'
      ansible.builtin.package:
        name:
          - epel-release
          - centos-release-nfv-openvswitch
        state: present

    - name: Install openvswitch-switch package
      vars:
        _ovs_packages:
          debian:
            - iproute2
            - openvswitch-switch
          redhat:
            - iproute
            - "{{ (ansible_facts['distribution_major_version'] | int >= 10) | ternary('openvswitch3.5', 'openvswitch') }}"
      ansible.builtin.package:
        name: "{{ _ovs_packages[ansible_facts['os_family'] | lower] }}"
        state: present
        update_cache: "{{ (ansible_facts['os_family'] == 'Debian') | ternary(true, omit) }}"
      become: true

    - name: Ensure openvswitch service is started
      vars:
        _ovs_service_name:
          debian: openvswitch-switch
          redhat: openvswitch
      ansible.builtin.service:
        name: "{{ _ovs_service_name[ansible_facts['os_family'] | lower] }}"
        state: started
        enabled: true
      become: true
